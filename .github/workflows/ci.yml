name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v7
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  native-quality:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable && corepack install
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      # The runner image ships several Xcodes and defaults to an older one than
      # developer machines use. That skew is what let a Sendable data-race error
      # reach main-bound code while compiling clean locally, so pick the newest
      # installed and print it — a native failure should never be a mystery about
      # which compiler ran.
      - name: Select and report the Xcode in use
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - run: pnpm quality:native
        env:
          SETLINE_DERIVED_DATA: ${{ runner.temp }}/setline-native-derived
      - name: Export the deferred-history UI screenshots
        if: success()
        env:
          SETLINE_DERIVED_DATA: ${{ runner.temp }}/setline-native-derived
        run: |
          result_bundle=$(printf '%s\n' "$SETLINE_DERIVED_DATA"/Logs/Test/*.xcresult | head -n 1)
          test -d "$result_bundle"
          xcrun xcresulttool export attachments \
            --path "$result_bundle" \
            --test-id 'SetlineUITests/testRecordedWorkoutSurvivesInterruptionRelaunchAndFinish()' \
            --output-path "$RUNNER_TEMP/setline-history-ui-evidence" \
            --filter '*.png'
      - name: Retain deferred-history UI screenshots
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: setline-history-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/setline-history-ui-evidence/
          retention-days: 7
      - name: Retain native failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: setline-native-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/setline-native-derived/Logs/Test/
          retention-days: 7
