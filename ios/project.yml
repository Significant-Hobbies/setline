name: Setline
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    # Personal team "Sarthak Agrawal". Never the Vault company team.
    DEVELOPMENT_TEAM: 8F7LXHTJZR
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  PersonalSyncKit:
    url: https://github.com/Significant-Hobbies/significanthobbies.git
    revision: 007cc255e75d291d10528ea9b123759d7e050be3
targets:
  SetlineCore:
    type: framework
    platform: iOS
    sources: Sources/SetlineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.setline.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  Setline:
    type: application
    platform: iOS
    sources:
      - path: Sources/Setline
      - path: Sources/Setline/Resources
        buildPhase: resources
    dependencies:
      - target: SetlineCore
      - package: PersonalSyncKit
    info:
      path: Sources/Setline/Info.plist
      properties:
        CFBundleDisplayName: Setline
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - setline
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.setline
        PRODUCT_NAME: Setline
        CODE_SIGN_ENTITLEMENTS: Sources/Setline/Setline.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  SetlineCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/SetlineCoreTests
    dependencies:
      - target: SetlineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.setline.core-tests
        GENERATE_INFOPLIST_FILE: YES
  SetlineTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/SetlineTests
    dependencies:
      - target: Setline
      - package: PersonalSyncKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.setline.tests
        GENERATE_INFOPLIST_FILE: YES
  SetlineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/SetlineUITests
    dependencies:
      - target: Setline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.setline.ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Setline:
    build:
      targets:
        Setline: all
        SetlineCoreTests: [test]
        SetlineTests: [test]
        SetlineUITests: [test]
    test:
      targets:
        - SetlineCoreTests
        - SetlineTests
        - SetlineUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
